name: Deploy Next.js SSR App to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (CI)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: 2112
          script: |
            echo "SSH connection successful"
            pwd

      - name: Upload to cPanel via SSH
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: . 
          remote_path: ${{ secrets.CPANEL_APP_PATH }}
          remote_host: ${{ secrets.CPANEL_SSH_HOST }}
          remote_user: ${{ secrets. CPANEL_SSH_USER }}
          remote_key: ${{ secrets. CPANEL_SSH_KEY }}
          remote_key_pass: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          remote_port: 2112

      - name: Install, Build & Restart App (Server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: 2112
          script: |
            cd ${{ secrets.CPANEL_APP_PATH }}
            npm install
            npm run build
            touch tmp/restart.txt
