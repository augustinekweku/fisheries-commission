name: Deploy Next.js SSR App to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (CI)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to cPanel via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_SSH_USER }}
          REMOTE_PORT: 2112
          SOURCE: ./
          TARGET: ${{ secrets.CPANEL_APP_PATH }}/
          EXCLUDE: >-
            .git, .github, node_modules, .next,
            .env, .env.local, .env.production, .DS_Store

      - name: Install, Build & Restart App (Server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: 2112
          script: |
            cd ${{ secrets.CPANEL_APP_PATH }}
            npm install
            npm run build
            touch tmp/restart.txt
