name: Deploy to cPanel via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:  ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets. CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT }}
          local_path: '. /*'
          remote_path: '/home/CPANEL_USER/nextjs-website/'
          sftp_only: true
          args: '--exclude=.git* --exclude=.github* --exclude=node_modules/ --exclude=.next/ --exclude=.env* --exclude=.DS_Store'